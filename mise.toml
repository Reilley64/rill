min_version = "2026.11.4"

[settings]
# Keep selected tools ahead of paths added after shell activation.
activate_aggressive = true
lockfile = true
locked = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]

[tools]
"core:rust" = { version = "1.98.0", profile = "minimal", components = ["rustfmt", "clippy"] }
"core:python" = "3.13.18"
"aqua:astral-sh/uv" = "0.13.8"

[env]
PYTHONDONTWRITEBYTECODE = "1"
UV_PYTHON_DOWNLOADS = "never"
UV_PROJECT_ENVIRONMENT = "{{ config_root }}/target/python"

[tasks.setup]
description = "Verify the mise-selected base tools, install locked Python check dependencies and enable the tracked git hooks"
run = ["python tools/doctor.py", "uv sync --project tools/python --locked --python $(mise which python) --no-python-downloads", "git config core.hooksPath .githooks"]

[tasks.doctor]
description = "Check the selected base tool versions and interpreter/toolchain locations"
run = "python tools/doctor.py"

[tasks.check]
description = "Run LLVM-free Rust tests, formatting, lint, documentation and fixture checks"
depends = ["check:rust", "check:m5", "check:docs", "check:comments", "check:fixtures", "check:tools", "test"]

[tasks."check:rust"]
description = "Check Rust formatting and LLVM-free clippy"
depends = ["doctor"]
run = ["cargo fmt --all -- --check", "cargo clippy --locked --no-default-features -p compiler -p ide -p lsp -p cli -p rill-collection -p rill-error-storage -p rill-runtime --all-targets -- -D warnings"]

[tasks.test]
description = "Run implemented LLVM-free Rust component tests, not complete Rill product acceptance"
depends = ["doctor"]
run = "cargo test --locked --no-default-features -p compiler -p ide -p lsp -p cli -p rill-collection -p rill-error-storage -p rill-runtime"

[tasks."test:compiler"]
description = "Run compiler unit, integration and documentation tests without LLVM"
depends = ["doctor"]
run = "cargo test --locked -p compiler --no-default-features"

[tasks."test:m5"]
description = "Run the M5 ownership test binary without LLVM, two test threads; pass a test filter after -- (mise run test:m5 -- <filter>)"
depends = ["doctor"]
run = "cargo test --locked --no-default-features -p compiler --test m5 -- --test-threads=2"

[tasks."test:m5:caps"]
description = "Replay the published fixed work/entries/depth caps (m5::legacy_caps) without LLVM"
depends = ["doctor"]
run = "cargo test --locked --no-default-features -p compiler --test m5 -- legacy_caps --test-threads=2"

[tasks."probe:m5"]
description = "Print the ownership pipeline's verdicts for the `=== name` sections of a sources file in both load modes (mise run probe:m5 -- <sources file>)"
depends = ["doctor"]
env = { RILL_M5_PROBE_VERBOSE = "1" }
run = "sh -c 'RILL_M5_PROBE_SOURCES=$(cd \"$(dirname \"$1\")\" && pwd)/$(basename \"$1\") cargo test --locked --no-default-features -p compiler --test m5 -- --ignored probe_sources --nocapture --test-threads=1' probe:m5"

[tasks."check:m5"]
description = "Fail when the M5 ownership test binary lists no tests on this platform"
depends = ["doctor"]
run = "cargo test --locked --no-default-features -p compiler --test m5 -- --list | grep -c ': test$'"

[tasks."status:prototypes"]
description = "Regenerate the committed prototype status table (crates/compiler/tests/m5/prototype-status.tsv) through the public pipeline"
depends = ["doctor"]
env = { RILL_PROTOTYPE_STATUS_WRITE = "1" }
run = "cargo test --locked --no-default-features -p compiler --test m5 -- prototype_status --test-threads=2"

[tasks."check:docs"]
depends = ["doctor"]
run = ["python tools/check_docs.py", "python tools/row_tests.py check", "git diff --check"]

[tasks."check:comments"]
description = "Refuse Rust comments added since the merge base with origin/main that are outside the keep list"
depends = ["doctor"]
run = "python tools/check_comments.py"

[tasks."check:fixtures"]
depends = ["setup"]
run = ["uv run --project tools/python --locked --no-sync python prototypes/21-diagnostics/check-fixtures.py", "python prototypes/23-tls/check.py", "python -m unittest discover -s experiments/sqlite-provider -p 'test_*.py'"]

[tasks."check:tools"]
depends = ["setup"]
run = ["uv run --project tools/python --locked --no-sync python -m unittest discover -s tools -p 'test_*.py'", "python -m unittest discover -s tools/llvm -p 'test_*.py'"]

[tasks."check:ci"]
description = "Validate GitHub Actions workflow syntax"
tools = { "aqua:rhysd/actionlint" = "1.7.12" }
run = "actionlint"

[tasks."build:scaffold"]
description = "Build the help/version CLI without LLVM; this is not a Rill compiler"
depends = ["doctor"]
run = "cargo build --locked -p cli --no-default-features"

[tasks.build]
description = "Unavailable: complete Rill toolchain implementation is not present"
run = "python tools/unavailable.py build"

[tasks."build:prototypes"]
description = "Build rill with the llvm feature and stage an installation in target/prototypes/prefix; needs LLVM_SYS_231_PREFIX (mise run setup:llvm)"
depends = ["doctor"]
env = { LLVM_SYS_231_STRICT_VERSIONING = "1" }
run = ["rm -rf target/prototypes/prefix", "python tools/stage_typed_installation.py --llvm target/prototypes/prefix"]

[tasks."test:prototypes"]
description = "Run the prototype acceptance tests through the rill staged by build:prototypes; needs LLVM_SYS_231_PREFIX"
depends = ["doctor"]
env = { LLVM_SYS_231_STRICT_VERSIONING = "1", RILL_PROTOTYPES_PREFIX = "{{ config_root }}/target/prototypes/prefix" }
run = "cargo test --locked -p cli --test prototypes"

[tasks."test:language"]
description = "Unavailable: executable Rill language conformance suite"
run = "python tools/unavailable.py test:language"

[tasks."test:stdlib"]
description = "Unavailable: executed Rill standard-library behavior"
run = "python tools/unavailable.py test:stdlib"

[tasks."test:runtime"]
description = "Unavailable: production Rill runtime/backend acceptance"
run = "python tools/unavailable.py test:runtime"

[tasks."test:lsp-client"]
description = "Unavailable: language server protocol acceptance"
run = "python tools/unavailable.py test:lsp-client"

[tasks."plan:llvm"]
description = "Show the optional pinned LLVM installation plan without downloading it"
run = "python tools/llvm/setup.py --plan"

[tasks."setup:llvm"]
description = "Explicitly install the pinned trimmed LLVM prefix from the Reilley64/rill release archive"
run = "python tools/llvm/setup.py"

[tasks."build:llvm"]
description = "Build this host's trimmed LLVM release archive from pinned source; takes 30 to 55 minutes, run by the release workflow"
tools = { "aqua:Kitware/CMake" = "4.4.5", "aqua:ninja-build/ninja" = "1.13.2" }
run = "python tools/llvm/release.py"

[tasks."test:llvm"]
description = "Verify the optional LLVM prefix and run a C-API static-link smoke test, not Rill acceptance"
run = "python tools/llvm/check.py --smoke"

[tasks."experiment:backend"]
description = "Reproduce the original macOS/AArch64 standalone backend experiment"
tools = { "core:node" = "26.13.0" }
run = "llvm_bin=$(python tools/llvm/check.py --bin-path) && python experiments/backend-30/run.py --llvm \"$llvm_bin\" --linker \"$llvm_bin/wasm-ld\" --fetch-tools --tools target/experiments/backend-tools --out target/experiments/backend"

[tasks."experiment:sqlite"]
description = "Reproduce the Darwin SQLite native fixture without overwriting its archived report"
run = "mkdir -p target/experiments && python experiments/sqlite-provider/reference/run.py --report target/experiments/sqlite-results.md"

[tasks."verify:release"]
description = "Require infrastructure, product build, language, standard-library and runtime checks"
run = ["mise run check", "mise run build", "mise run test:language", "mise run test:stdlib", "mise run test:runtime"]
