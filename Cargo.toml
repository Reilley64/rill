[workspace]
members = [
    "crates/compiler",
    "crates/ide",
    "crates/lsp",
    "crates/codegen-llvm",
    "crates/cli",
    "runtime/collection",
    "runtime/native",
    "runtime/error",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
compiler = { path = "crates/compiler" }
ide = { path = "crates/ide" }
lsp = { path = "crates/lsp" }
codegen-llvm = { path = "crates/codegen-llvm" }

# The compiler's analysis tests run for minutes unoptimized, most of the macos-15-intel Native job.
# Debug assertions and overflow checks stay on; only the code generation level changes.
[profile.dev.package.compiler]
opt-level = 1
