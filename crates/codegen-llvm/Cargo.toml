[package]
name = "codegen-llvm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
compiler.workspace = true
inkwell = { version = "=0.11.0", default-features = false, features = ["llvm23-1-force-static", "no-libffi-linking"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
inkwell = { version = "=0.11.0", default-features = false, features = ["target-x86"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
inkwell = { version = "=0.11.0", default-features = false, features = ["target-aarch64"] }
