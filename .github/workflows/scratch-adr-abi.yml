name: "Test: Scratch ADR 0036 ABI measurement"

on:
  push:
    branches: [m6-1-hello/adr-layouts]
    paths:
      - 'experiments/adr-0036-abi/**'
      - '.github/workflows/scratch-adr-abi.yml'

permissions:
  contents: read

jobs:
  measure:
    name: "Test: ABI measurement (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Run: Measure the calling shapes"
        run: sh experiments/adr-0036-abi/run.sh
