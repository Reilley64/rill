name: "Release: Trimmed LLVM archives"

# Hand-triggered only. Builds LLVM from source, so nothing runs it on push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

# Explicit homes keep nested mise commands on the same Rustup provider.
env:
  CARGO_HOME: ${{ github.workspace }}/target/ci/cargo
  RUSTUP_HOME: ${{ github.workspace }}/target/ci/rustup

jobs:
  archive:
    name: "Build and release: Trimmed LLVM (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Setup: Install mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.8
          install: false
          cache: false

      - name: "Setup: Install the locked tools"
        run: mise install --locked

      - name: "Setup: Select the output directory"
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-release"
          echo "LLVM_OUT=$RUNNER_TEMP/llvm-release" >> "$GITHUB_ENV"

      - name: "Run: Record free disk before the build"
        run: |
          {
            echo "## Disk before the build, ${{ matrix.os }}"
            echo '```'
            df -k "$LLVM_OUT"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Build and package: Compile, archive and verify the trimmed LLVM"
        run: mise run build:llvm -- --out "$LLVM_OUT"

      - name: "Run: Record disk use of the build"
        if: always()
        run: |
          {
            echo "## Disk after the build, ${{ matrix.os }}"
            echo '```'
            df -k "$LLVM_OUT"
            du -sk "$LLVM_OUT/work" "$LLVM_OUT/work/build" "$LLVM_OUT/work/stage" "$LLVM_OUT/work/src" || true
            ls -l "$LLVM_OUT"
            cat "$LLVM_OUT"/*.sha256 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Publish: Upload the archive and its checksum"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-release-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/llvm-release/llvm-*.tar.xz
            ${{ runner.temp }}/llvm-release/llvm-*.tar.xz.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
