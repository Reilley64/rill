name: "Test: Native acceptance"

on:
  push:
    branches: [main]
    paths: &native_paths
      - 'crates/**'
      - 'stdlib/**'
      - 'runtime/**'
      - 'tests/**'
      - 'tools/unavailable.py'
      - 'tools/stage_typed_installation.py'
      - 'tools/llvm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/native.yml'
  pull_request:
    paths: *native_paths
  workflow_dispatch:

permissions:
  contents: read

# Explicit homes keep nested mise commands on the same Rustup provider.
env:
  CARGO_HOME: ${{ github.workspace }}/target/ci/cargo
  RUSTUP_HOME: ${{ github.workspace }}/target/ci/rustup

jobs:
  native:
    name: "Test: Native acceptance (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            llvm: linux-x64
          - os: ubuntu-24.04-arm
            llvm: linux-arm64
          - os: macos-15
            llvm: macos-arm64
          - os: macos-15-intel
            llvm: macos-x64

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: "Setup: Install mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.8
          install: false
          cache: false

      - name: "Setup: Install the locked tools"
        run: mise install --locked

      - name: "Setup: Restore the Cargo build cache"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/debug
            target/*/debug
            target/ci/cargo/registry
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'mise.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'mise.toml', 'mise.lock') }}-

      - name: "Setup: Install the trimmed LLVM"
        run: mise run setup:llvm

      - name: "Test: Run the LLVM backend smoke"
        env:
          LLVM_SYS_231_PREFIX: ${{ github.workspace }}/target/toolchains/llvm-23.1.5/${{ matrix.llvm }}
          LLVM_SYS_231_STRICT_VERSIONING: "1"
        run: mise exec -- cargo test --locked -p codegen-llvm

      - name: "Build: Stage the prototypes installation"
        env:
          LLVM_SYS_231_PREFIX: ${{ github.workspace }}/target/toolchains/llvm-23.1.5/${{ matrix.llvm }}
          LLVM_SYS_231_STRICT_VERSIONING: "1"
        run: mise run build:prototypes

      - name: "Test: Run the prototype acceptance through the staged rill"
        env:
          LLVM_SYS_231_PREFIX: ${{ github.workspace }}/target/toolchains/llvm-23.1.5/${{ matrix.llvm }}
          LLVM_SYS_231_STRICT_VERSIONING: "1"
        run: mise run test:prototypes

      - name: "Test: Verify native runtime acceptance is unavailable"
        run: |
          status=0
          output=$(mise run test:runtime 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 2 ] || ! printf '%s\n' "$output" | grep -qF 'test:runtime is not implemented in this scaffold'; then
            echo "::error::test:runtime no longer reports the scaffold stub (exit $status). Replace this assertion with the real acceptance run."
            exit 1
          fi

      # The release task runs the repository checks and then the product build,
      # which is a stub that exits 2. The stub message appears only after the
      # checks passed, so a failing check still fails this step. Replace this
      # step with `mise run verify:release` when the product build exists.
      - name: "Build and test: Verify release acceptance stops at the unavailable build task"
        if: github.event_name == 'workflow_dispatch'
        run: |
          status=0
          output=$(mise run verify:release 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 2 ] || ! printf '%s\n' "$output" | grep -qF 'build is not implemented in this scaffold'; then
            echo "::error::verify:release no longer stops at the build stub (exit $status). Replace this assertion with the real release run if the build exists or its message changed. Otherwise a check before the build failed."
            exit 1
          fi
