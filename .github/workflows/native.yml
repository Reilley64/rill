name: Native acceptance gate

on:
  push:
    paths: &native_paths
      - 'crates/**'
      - 'stdlib/**'
      - 'runtime/**'
      - 'tests/**'
      - 'tools/unavailable.py'
      - 'tools/llvm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/native.yml'
  pull_request:
    paths: *native_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.8
          install: false
          cache: false
      - run: mise install --locked
      # This gate is unavailable, not successful, until native acceptance exists.
      # Do not substitute a C-API installation smoke for Rill runtime acceptance.
      - run: mise run test:runtime
      - if: github.event_name == 'workflow_dispatch'
        run: mise run verify:release
