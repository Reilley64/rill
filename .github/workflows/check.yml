name: "Test: Scaffold checks"

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Explicit homes keep nested mise commands on the same Rustup provider.
env:
  CARGO_HOME: ${{ github.workspace }}/target/ci/cargo
  RUSTUP_HOME: ${{ github.workspace }}/target/ci/rustup

jobs:
  check:
    name: "Test: Scaffold checks (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: "Setup: Install mise"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.8
          install: false
          cache: false

      - name: "Setup: Install the locked tools"
        run: mise install --locked

      - name: "Test and scan: Check the LLVM-free scaffold"
        run: mise run check

      - name: "Build: Build the CLI scaffold"
        run: mise run build:scaffold

      - name: "Scan: Validate GitHub workflows"
        run: mise run check:ci

      - name: "Policy: Preserve the committed locks"
        run: git diff --exit-code -- Cargo.lock mise.lock tools/python/uv.lock
